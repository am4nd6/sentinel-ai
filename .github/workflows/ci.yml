name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B test package

  intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -e ".[test]"
      - run: pytest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use a standalone scanner; gitleaks-action now requires a paid license.
      - name: Scan repository for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          trufflesecurity/trufflehog:3.90.8
          filesystem /repo --no-update --fail --exclude-paths=/repo/.trufflehog-exclude
