name: Release demo
on:
  workflow_dispatch:
    inputs:
      image_tag:
        required: true
        default: local
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: docker compose -f infra/compose/docker-compose.yml config
  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: demo-approval
    steps:
      - uses: actions/checkout@v4
      - name: Publish approved synthetic release
        run: echo "Publishing synthetic-only tag ${{ inputs.image_tag }}"
      - name: Rollback command
        if: failure()
        run: echo "Rollback to previous approved tag is required before retry"
