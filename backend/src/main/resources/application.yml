spring:
  application:
    name: sentinel-backend
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
sentinel:
  environment: ${SENTINEL_ENVIRONMENT:local}
  security:
    dev-secret: ${SENTINEL_JWT_SECRET:sentinel-local-development-secret-32-chars}
